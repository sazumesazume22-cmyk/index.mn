<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICLEOD ONLINE SHOP — Exclusive Concept Store</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0B0D;
            --surface: #141418;
            --surface-hover: #1C1C22;
            --text: #F5F5F7;
            --muted: #8E8E98;
            --neon: #CCFF00;
            --accent: #FF4D00;
            --border: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* Дээд гүйх зарлал */
        .marquee {
            background: var(--neon);
            color: #000;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
        }
        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 5%;
            background: rgba(11, 11, 13, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            color: var(--neon);
            font-size: 11px;
            border: 1px solid var(--neon);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-link {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: 0.2s;
        }
        .nav-link:hover {
            border-color: var(--neon);
            color: var(--neon);
        }

        .cart-btn {
            background: var(--neon);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cart-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.4);
        }

        /* Hero Section */
        .hero {
            padding: 70px 5%;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 50px;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            color: var(--neon);
            margin-bottom: 20px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--neon);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hero h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(38px, 5vw, 72px);
            line-height: 0.98;
            text-transform: uppercase;
            margin-bottom: 22px;
        }
        .hero h1 span {
            -webkit-text-stroke: 1.5px var(--neon);
            color: transparent;
        }

        .hero p {
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
            max-width: 480px;
            margin-bottom: 32px;
        }

        .hero-btns {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--text);
            color: var(--bg);
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: var(--neon);
            color: #000;
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--border);
            font-size: 15px;
            transition: 0.2s;
        }
        .btn-outline:hover { border-color: var(--text); }

        .hero-img-box {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            height: 460px;
        }
        .hero-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .hero-img-box:hover img { transform: scale(1.05); }
        .floating-card {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(20, 20, 24, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Бүтээгдэхүүн ба Шүүлтүүр */
        .shop-section { padding: 70px 5%; }

        .shop-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .shop-top h2 {
            font-family: 'Syne', sans-serif;
            font-size: 36px;
        }

        .filters { display: flex; gap: 10px; }

        .filter-btn {
            background: var(--surface);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--neon);
            color: #000;
            border-color: var(--neon);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 28px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(204, 255, 0, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .card-img {
            height: 310px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
        }
        .card:hover .card-img img { transform: scale(1.07); }

        .card-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(11, 11, 13, 0.88);
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .card-body { padding: 20px; }
        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .card-price {
            color: var(--neon);
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 46px;
            gap: 8px;
        }

        .add-cart {
            background: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-cart:hover {
            background: var(--neon);
            color: #000;
            border-color: var(--neon);
        }

        .view-btn {
