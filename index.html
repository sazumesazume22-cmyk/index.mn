<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAZUME31 — Өвөрмөц Онлайн Дэлгүүр</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F1EA;
            --text-color: #111111;
            --accent-color: #FF4D00;
            --card-bg: #FFFFFF;
            --border-width: 2.5px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* Дээд гүйж буй зарлал */
        .marquee {
            background: var(--text-color);
            color: var(--bg-color);
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            border-bottom: var(--border-width) solid var(--text-color);
        }

        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 18s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Цэс (Navbar) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: var(--border-width) solid var(--text-color);
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 100;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .phone-link {
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            border: 2px solid var(--text-color);
            padding: 9px 14px;
            background: #FFF;
            font-size: 14px;
        }

        .cart-btn {
            background: var(--accent-color);
            color: #FFF;
            border: var(--border-width) solid var(--text-color);
            padding: 10px 22px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--text-color);
            transition: all 0.15s ease;
        }

        .cart-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--text-color);
        }

        /* Нүүр хэсэг */
        .hero {
            padding: 70px 5%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
            border-bottom: var(--border-width) solid var(--text-color);
        }

        .hero h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(42px, 6vw, 82px);
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .hero h1 span {
            color: var(--accent-color);
            font-style: italic;
        }

        .hero p {
            font-size: 18px;
            max-width: 480px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .hero-badge {
            display: inline-block;
            background: #D4FF00;
            border: var(--border-width) solid var(--text-color);
            padding: 6px 14px;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 16px;
            transform: rotate(-2deg);
        }

        .hero-visual {
            background: var(--accent-color);
            border: var(--border-width) solid var(--text-color);
            height: 420px;
            border-radius: 200px 200px 0 0;
            box-shadow: 10px 10px 0px var(--text-color);
            overflow: hidden;
            position: relative;
        }

        .hero-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: luminosity;
            transition: transform 0.5s ease;
        }

        .hero-visual:hover img {
            transform: scale(1.06);
            mix-blend-mode: normal;
        }

        /* Бүтээгдэхүүний хэсэг */
        .products-section {
            padding: 60px 5%;
            border-bottom: var(--border-width) solid var(--text-color);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 38px;
            text-transform: uppercase;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 32px;
        }

        .product-card {
            background: var(--card-bg);
            border: var(--border-width) solid var(--text-color);
            box-shadow: 6px 6px 0px var(--text-color);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-6px) rotate(0.5deg);
            box-shadow: 10px 10px 0px var(--accent-color);
        }

        .product-img {
            width: 100%;
            height: 300px;
            border-bottom: var(--border-width) solid var(--text-color);
            overflow: hidden;
            position: relative;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-img img {
            transform: scale(1.08);
        }

        .tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--bg-color);
            border: 2px solid var(--text-color);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 16px;
        }

        .add-btn {
            width: 100%;
            background: var(--text-color);
            color: #FFF;
            border: none;
            padding: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: var(--accent-color);
        }

        /* Холбоо барих & Доод хэсэг (Footer) */
        footer {
            background: var(--text-color);
            color: var(--bg-color);
            padding: 60px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }

        footer h3 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            margin-bottom: 16px;
            color: #D4FF00;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            display: inline-block;
            background: var(--bg-color);
            color: var(--text-color);
            text-decoration: none;
            padding: 12px 18px;
            font-weight: 700;
            border: 2px solid var(--accent-color);
            transition: all 0.2s;
            text-align: center;
        }

        .social-btn:hover {
            background: var(--accent-color);
            color: #FFF;
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px #D4FF00;
        }

        /* Сагсны цонх */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 380px;
            height: 100vh;
            background: var(--bg-color);
            border-left: var(--border-width) solid var(--text-color);
            z-index: 200;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-width) solid var(--text-color);
            padding-bottom: 16px;
        }

        .close-btn {
            background: none;
            border: 2px solid var(--text-color);
            width: 34px;
            height: 34px;
            font-weight: 700;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
